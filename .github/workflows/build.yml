name: Build Amethyst IPA

# Builds an unsigned Amethyst.ipa (with the checkra1n migration feature) on a
# macOS runner and uploads it as a workflow artifact. Run it from the Actions
# tab (workflow_dispatch) or on every push.

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  probe:
    # Fast, independent job: builds the read-only checkra1n kernel-access probe
    # (migrator/tfp0probe). Only needs clang + ldid, so it finishes quickly even
    # when the heavy IPA build is stuck in the macOS runner queue.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install ldid
        run: brew install ldid
      - name: Build tfp0 probe
        working-directory: migrator/tfp0probe
        run: |
          set -euo pipefail
          make
          test -f tfp0probe
          echo "=== entitlements ===" && ldid -e tfp0probe | head -20
          file tfp0probe
      - name: Upload probe + connect script
        uses: actions/upload-artifact@v4
        with:
          name: tfp0probe
          path: |
            migrator/tfp0probe/tfp0probe
            migrator/connect.sh
          if-no-files-found: error

  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install build tools
        run: brew install ldid llvm dpkg

      - name: Build basebins (produces basebins.tar + tnsv2 debs)
        working-directory: basebins
        run: |
          set -euo pipefail
          # llvm-objcopy comes from the Homebrew llvm keg; the Makefiles locate it
          # via `which llvm-objcopy`, so it must be on PATH.
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          make package
          test -f basebins.tar
          ls -lh basebins.tar tnsv2_updater.deb tnsv2_updater_stub.deb

      - name: Build unsigned IPA
        working-directory: Amethyst
        run: |
          set -euo pipefail
          rm -rf ./build
          xcodebuild clean build \
            -project Amethyst.xcodeproj \
            -scheme Amethyst \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

          APP="build/Build/Products/Release-iphoneos/Amethyst.app"
          test -d "$APP"
          strip "$APP/Amethyst" || true
          # Sign with kernel-access entitlements so the app can borrow checkra1n's
          # kernel task port under AppSync. ldid takes -S<file> with NO space.
          test -f migrate.entitlements
          ldid -Smigrate.entitlements "$APP/Amethyst"
          echo "=== entitlements embedded ===" && ldid -e "$APP/Amethyst" | head -40

          rm -rf Payload Amethyst.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Amethyst.ipa
          ls -lh Amethyst.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-ipa
          path: Amethyst/Amethyst.ipa
          if-no-files-found: error
